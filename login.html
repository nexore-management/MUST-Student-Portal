<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | MUST Apply</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
    <div class="register-card">
        <div class="brand">
            <div class="brand-logo">M</div>
            <h1>MUST <span>APPLY</span></h1>
            <p>STUDENT APPLICATION PORTAL</p>
        </div>
        <div class="form-heading">
            <h2>Welcome Back</h2>
            <p>Sign in to continue to your account.</p>
        </div>
        <div class="message error" id="login-message" hidden>
            This is a front-end demonstration. Real sign-in requires a PHP/MySQL backend.
        </div>
        <form id="login-form">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your registered email" autocomplete="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="submit">SIGN IN</button>
        </form>
        <p class="login-link">Don't have an account? <a href="register.html">Create account</a></p>
        <div class="footer">MUST APPLY PORTAL</div>
        <p class="login-link"><a href="index.html">Back to home</a></p>
    </div>
</div>
<script>
document.getElementById("login-form").addEventListener("submit", function(event) {
    event.preventDefault();
    document.getElementById("login-message").hidden = false;
});
</script>
</body>
</html>
